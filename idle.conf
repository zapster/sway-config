# Seconds of inactivity; output power resumes on input.
timeout 300 'swaylock -f -C ~/.config/sway/lock.conf'
timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"'

# -w waits for swaylock -f to confirm the compositor is locked before sleep.
before-sleep 'swaylock -f -C ~/.config/sway/lock.conf'
after-resume 'swaymsg "output * power on"'
lock 'swaylock -f -C ~/.config/sway/lock.conf'
